name: Casting monitor checks
on:
  push:
    branches: [main, feat/selected-casting-sources-ai-safety, feat/guardian-watchdog-and-privacy, feat/web-qr-owner-pilot]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m compileall -q app scripts tests
      - run: WEB_BROWSER_TESTS=1 python -m unittest discover -s tests -v
